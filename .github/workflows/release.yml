name: Release
# Every push to main (and the "Run workflow" button, which can pick a minor/major bump):
#   1. test on Windows, macOS and Linux - any failure stops here, nothing is released
#   2. bump the version, commit it to main and tag it
#   3. build all installers into one draft release (created first, so parallel uploads can't race to create it)
#   4. publish the release once every platform built - installed copies then update themselves
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" --no-git-tag-version
          TAG="v$(node -p "require('./package.json').version")"
          git commit -am "$TAG [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
          gh release create "$TAG" --draft --verify-tag --title "Switcher ${TAG#v}" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packaging tools (rpm for .rpm, bsdtar for .pacman)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft (only reached when all three platforms built)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
