<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Switcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside>
    <h1>Switcher</h1>
    <p id="active" aria-live="polite"></p>
    <form id="add">
      <input id="name" placeholder="Name or email, e.g. work" aria-label="Account name" required maxlength="64">
      <button class="primary">Add Account</button>
    </form>
    <p id="msg" aria-live="polite"></p>
    <h2>Session manager</h2>
    <section class="panel">
      <label class="check"><input type="checkbox" id="autoStart"> Keep a 5-hour session running on every account</label>
      <label for="message">Starting message</label>
      <input id="message" maxlength="500" placeholder="hi">
    </section>
    <details class="panel settings">
      <summary>Settings</summary>
      <label class="check"><input type="checkbox" id="startAtLogin"> Start Switcher when I log in</label>
      <label class="check"><input type="checkbox" id="notify"> Desktop notifications</label>
      <div class="shortcut-head">
        <label for="shortcut">Quick switcher shortcut</label>
        <button type="button" id="clearShortcut" class="link">Turn off</button>
      </div>
      <input id="shortcut" readonly autocomplete="off" aria-describedby="settingsHint">
      <small id="settingsHint" aria-live="polite"></small>
    </details>
    <p id="update" class="update" aria-live="polite"></p>
  </aside>
  <main>
    <h2>Accounts</h2>
    <ul id="list"></ul>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
